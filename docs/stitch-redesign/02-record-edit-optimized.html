<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>编辑记录 - CervixDetectAI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                extend: {
                    "colors": {
                        "outline": "#717783",
                        "on-secondary-container": "#56656e",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "secondary-container": "#d3e2ed",
                        "tertiary-fixed": "#94f990",
                        "primary-fixed": "#d4e3ff",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed-dim": "#a5c8ff",
                        "surface-dim": "#d8dadc",
                        "primary": "#005dac",
                        "surface-variant": "#e0e3e5",
                        "on-primary-container": "#fffdff",
                        "on-secondary": "#ffffff",
                        "background": "#f7f9fb",
                        "inverse-primary": "#a5c8ff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#1976d2",
                        "on-surface-variant": "#414752",
                        "surface-bright": "#f7f9fb",
                        "secondary": "#526069",
                        "tertiary-container": "#1f872e",
                        "outline-variant": "#c1c6d4",
                        "on-primary-fixed-variant": "#004786",
                        "on-tertiary-fixed-variant": "#005313",
                        "surface-container-high": "#e6e8ea",
                        "secondary-fixed": "#d6e5ef",
                        "on-secondary-fixed-variant": "#3b4951",
                        "surface-container": "#eceef0",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed": "#0f1d25",
                        "surface": "#f7f9fb",
                        "on-tertiary-container": "#fbfff5",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed": "#001c3a",
                        "secondary-fixed-dim": "#bac9d3",
                        "surface-tint": "#005faf",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#002204",
                        "on-background": "#191c1e",
                        "tertiary-fixed-dim": "#78dc77",
                        "tertiary": "#006c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "sm": "12px",
                        "xs": "8px",
                        "base": "4px",
                        "lg": "24px",
                        "container-padding": "16px",
                        "gutter": "12px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "headline-md-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],

                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md-mobile": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-sm": ["17px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "display-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 93, 172, 0.2);
            border-color: #005dac;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative pb-[80px]">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-inverse-primary docked full-width top-0 flat no shadows flex items-center justify-between px-md w-full h-14 sticky z-40 transition-colors">
<button aria-label="返回" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:opacity-70 transition-opacity text-on-surface-variant dark:text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary dark:text-primary-fixed truncate flex-1 text-center">CervixDetectAI</h1>
<button aria-label="更多" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:opacity-70 transition-opacity text-on-surface-variant dark:text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-2xl mx-auto px-md py-lg flex flex-col gap-lg pb-24">
<!-- Page Header -->
<div class="mb-sm">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">编辑记录</h2>
<p class="font-body-md text-body-md text-on-surface-variant">请更新或完善您的检查记录信息。</p>
</div>
<!-- Section 1: 基础信息 -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,93,172,0.04)] p-md flex flex-col gap-md">
<h3 class="font-headline-sm text-headline-sm text-primary flex items-center gap-xs border-b border-surface-container-highest pb-xs">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">info</span>
                基础信息
            </h3>
<!-- Date Input -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="record-date">检查日期</label>
<div class="relative flex items-center bg-surface rounded-lg border border-outline-variant input-focus-ring transition-all duration-200">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface pl-xl pr-sm py-sm rounded-lg" id="record-date" type="date" value="2023-10-24"/>
</div>
</div>
<!-- Title Input -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="record-title">记录标题</label>
<div class="flex items-center bg-surface rounded-lg border border-outline-variant input-focus-ring transition-all duration-200">
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface px-sm py-sm rounded-lg" id="record-title" placeholder="请输入标题" type="text" value="年度常规筛查"/>
</div>
</div>
<!-- Project Type Select -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="record-project">检查项目</label>
<div class="relative flex items-center bg-surface rounded-lg border border-outline-variant input-focus-ring transition-all duration-200">
<select class="w-full appearance-none bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface pl-sm pr-xl py-sm rounded-lg" id="record-project">
<option value="tct">TCT液基细胞学检测</option>
<option selected="" value="hpv">HPV病毒分型检测</option>
<option value="colposcopy">阴道镜检查</option>
<option value="biopsy">活检病理</option>
</select>
<span class="material-symbols-outlined absolute right-sm text-on-surface-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">arrow_drop_down</span>
</div>
</div>
</section>
<!-- Section 2: 记录内容 -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,93,172,0.04)] p-md flex flex-col gap-md">
<h3 class="font-headline-sm text-headline-sm text-primary flex items-center gap-xs border-b border-surface-container-highest pb-xs">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">description</span>
                记录内容
            </h3>
<!-- Summary Textarea -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant flex justify-between" for="record-summary">
<span>诊断摘要</span>
<span class="text-outline">15/200</span>
</label>
<div class="bg-surface rounded-lg border border-outline-variant input-focus-ring transition-all duration-200">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface px-sm py-sm rounded-lg resize-none" id="record-summary" placeholder="请输入诊断摘要或详细结果..." rows="4">未见上皮内病变或恶性细胞，HPV52阳性。</textarea>
</div>
</div>
<!-- Suggestions Textarea -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="record-suggestions">提醒与建议 (选填)</label>
<div class="bg-surface rounded-lg border border-outline-variant input-focus-ring transition-all duration-200">
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface px-sm py-sm rounded-lg resize-none" id="record-suggestions" placeholder="例如：医生建议半年后复查..." rows="3">医生建议保持良好作息，半年后复查HPV及TCT。</textarea>
</div>
</div>
<!-- Attachment Upload (Decorative) -->
<div class="flex flex-col gap-base mt-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">报告附件</label>
<div class="flex gap-sm overflow-x-auto no-scrollbar pb-xs">
<!-- Existing Image -->
<div class="relative w-20 h-20 shrink-0 rounded-lg overflow-hidden border border-surface-container-high group">
<img alt="Medical Document" class="w-full h-full object-cover" data-alt="A close-up shot of a stylized, modern medical document with subtle blue highlights resting on a clean white surface. Soft, diffused lighting creates a clinical yet calming atmosphere. The aesthetic is bright and professional, aligning with a sophisticated light-mode healthcare interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuZM2mY391yKPghSSWjjt1Z99sNU4oBkzpGel-RMe4ztKlqE_SHiQT6Leh04RgMGNRP0cVOZ0nVc-WG6xN6sgbPHaBhaXQH2T13-tyfvSuyDqjbNXcO2uqwo5WLGiVB1p_kGhqvsNbKJKz67ebktMc-ErOcxbAokiLvj4Q2jCmbZctYuZ5RPprbm4UrXqaWlH461DP1qdn29XOWbJN7k7LFeKd6j5Y1yAWzq9UlbFrBn7pbW1vuO8dtsqbqlKzbaYmk-P51X52p03-"/>
<button aria-label="删除附件" class="absolute top-1 right-1 w-6 h-6 bg-error/90 text-on-error rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Add Button -->
<button class="w-20 h-20 shrink-0 rounded-lg border-2 border-dashed border-outline-variant flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low hover:border-primary transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[24px]">add_a_photo</span>
<span class="font-label-sm text-[10px] mt-1">添加图片</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area (Floating) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-surface-container-high p-md pb-safe z-40 flex justify-end gap-sm shadow-[0_-4px_20px_rgba(0,0,0,0.04)]">
<button class="px-lg py-sm rounded-full font-label-sm text-label-sm font-semibold border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
            取消
        </button>
<button class="px-xl py-sm rounded-full font-label-sm text-label-sm font-semibold bg-primary text-on-primary shadow-sm hover:bg-surface-tint hover:shadow-md transition-all active:scale-95 flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">save</span>
            保存记录
        </button>
</div>
</body></html>
