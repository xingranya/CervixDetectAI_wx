<main class="flex-1 w-full max-w-2xl mx-auto px-md py-lg flex flex-col gap-lg">

<section class="flex flex-col gap-sm">
<h2 class="font-display-lg text-display-lg text-on-surface">设置提醒</h2>
<p class="font-body-md text-body-md text-on-surface-variant">为您重要的医疗日程安排提醒，确保不错过任何关键时刻。</p>
</section>
<!-- Quick Select Cards (Bento Style) -->
<section class="grid grid-cols-3 gap-sm">
<!-- Card 1: Follow-up -->
<button class="bg-surface-container-lowest rounded-xl p-md flex flex-col items-center justify-center gap-sm shadow-[0_4px_15px_rgba(0,93,172,0.04)] border border-outline-variant/30 hover:border-primary transition-all active:scale-95 group focus:outline-none focus:ring-2 focus:ring-primary/50">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center group-hover:bg-primary-fixed transition-colors">

</div>

</button>

</div>

</button>

<label class="font-body-md text-body-md font-semibold text-on-surface" for="reminder-title">提醒标题</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="edit_note">edit_note</span>
<input class="w-full bg-surface pl-10 pr-md py-sm rounded-lg border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim/50 outline-none transition-all font-body-md text-body-md text-on-surface placeholder:text-outline" id="reminder-title" placeholder="例如：去医院进行TCT复查" type="text"/>
</div>
</div>

</div>
</div>

</div>
</div>
</div>

<input checked="" class="peer sr-only" name="advance-notice" type="radio"/>
<div class="px-sm py-xs rounded-lg border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary peer-checked:text-on-primary-fixed-variant font-body-md text-body-md text-on-surface-variant transition-colors hover:bg-surface-container-low">

<label class="cursor-pointer">
<input class="peer sr-only" name="advance-notice" type="radio"/>
<div class="px-sm py-xs rounded-lg border border-outline-variant peer-checked:bg-primary-fixed peer-checked:border-primary peer-checked:text-on-primary-fixed-variant font-body-md text-body-md text-on-surface-variant transition-colors hover:bg-surface-container-low">

<label class="cursor-pointer">
<input class="peer sr-only" name="advance-notice" type="radio"/>

                            提前1小时

<label class="cursor-pointer">
<input class="peer sr-only" name="advance-notice" type="radio"/>

</label>
</div>
